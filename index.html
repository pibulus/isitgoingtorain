    <style>

        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding:
                max(clamp(1.5rem, 4vw, 3rem), env(safe-area-inset-top))
                max(clamp(1.1rem, 4vw, 3rem), env(safe-area-inset-right))
                max(clamp(1.5rem, 4vw, 3rem), env(safe-area-inset-bottom))
                max(clamp(1.1rem, 4vw, 3rem), env(safe-area-inset-left));

            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: auroraShift 42s ease-in-out infinite;
            transition: background 0.9s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
        }

        body.idle {
            --bg-gradient: linear-gradient(135deg, #fff1e8, #ffe4f4 34%, #efe3ff 68%, #dff4ff);
            --answer-accent: #ff8fb6;
            --answer-glow: rgba(255, 143, 182, 0.18);
        }

        body.loading {
            --bg-gradient: linear-gradient(120deg, #efe7ff, #ffdff1, #ffe6d4, #dcf3f5);
            --answer-accent: #8b7cff;
            --answer-glow: rgba(139, 124, 255, 0.22);
        }

        body.yes {
            --bg-gradient: linear-gradient(135deg, #dde4ff, #d4ecff 30%, #efdfff 66%, #fff0ca);
            --answer-accent: #625dce;
            --answer-glow: rgba(98, 93, 206, 0.22);
        }

        body.maybe {
            --bg-gradient: linear-gradient(135deg, #dff6ff, #dce8ff 34%, #f0e4ff 70%, #fff4d6);
            --answer-accent: #4f7bd6;

        body.no {
            --bg-gradient: linear-gradient(135deg, #fff2cf, #ffe1d3 34%, #ffdff0 68%, #f7e9ff);
            --answer-accent: #dd8a49;
            --answer-glow: rgba(221, 138, 73, 0.2);
        }

        body.delight .card {
            box-shadow: 0 30px 74px rgba(255, 130, 191, 0.18);
        }

        body.delight .weather-scene {
            filter: saturate(1.08) brightness(1.03);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.35) 1px, transparent 1px);
            background-size: var(--dot-size) var(--dot-size);
            opacity: var(--dot-opacity);
            pointer-events: none;
            z-index: -1;
        }

        body::after {
            content: "";
            position: fixed;
            inset: -16%;
            background: var(--haze-gradient);
            animation: gradientShift 34s ease-in-out infinite;
            filter: blur(var(--haze-blur));
            opacity: var(--haze-opacity);
            pointer-events: none;
            z-index: -2;
        }

        }

            animation: skyWink 720ms cubic-bezier(0.22, 1, 0.36, 1);

        .weather-scene {
            display: block;
            position: relative;
            width: min(100%, 260px);
            min-height: 224px;
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid rgba(17, 19, 34, 0.08);
            background:
                radial-gradient(circle at 74% 20%, var(--scene-sky-glow), transparent 26%),
                linear-gradient(180deg, var(--scene-top) 0%, var(--scene-mid) 54%, var(--scene-bottom) 100%);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.9),
                inset 0 -16px 28px rgba(149, 121, 255, 0.08),
                inset 0 -28px 44px rgba(255, 255, 255, 0.18),
                0 18px 28px rgba(17, 19, 34, 0.08);
            transform: perspective(900px) rotateX(var(--sky-tilt-y)) rotateY(var(--sky-tilt-x)) rotate(var(--scene-tilt)) translate3d(var(--sky-drift-x), var(--sky-drift-y), 0);
            transform-style: preserve-3d;
            transition: transform 0.36s ease;
        }

            content: "";
            position: absolute;
            inset: 0;
            background:

            height: 24px;
            border-radius: 999px;
            background:

            filter: blur(8px);
            opacity: 0.7;

            height: 90px;

        .scene-cloud {

        .error-actions,
        .manual-form {
            display: flex;
            flex-wrap: wrap;
            gap: 0.85rem;
            align-items: center;
        }

        .cta-button,
        .ghost-button,
        .utility-button {
            min-height: 52px;
            border-radius: 999px;
            border: 0;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease, border-color 0.25s ease;
        }

        .cta-button {
            position: relative;
            isolation: isolate;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 1rem 2rem;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0;
            text-transform: none;
            background-image: var(--cta-gradient);
            background-size: 180% 180%;
            box-shadow: var(--button-shadow);
        }

        body.idle .cta-button {
            animation: microBreathe 4.2s ease-in-out infinite;
        }

        .cta-button::before {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: inherit;
            background:
                radial-gradient(circle at 50% 10%, rgba(255, 255, 255, 0.42), transparent 56%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.18), transparent 70%);
            opacity: 0.86;
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
        }

        .cta-button::after {
            content: "";
            position: absolute;
            inset: 3px;
            border-radius: inherit;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.46), transparent 60%);
            opacity: 0.72;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }

        .cta-button:active {
            animation: none;
            transform: translateY(1px) scale(0.995);
            box-shadow:
                0 14px 24px rgba(128, 81, 255, 0.18),
                inset 0 2px 4px rgba(255, 255, 255, 0.14);
        }

        .cta-button:active::before {
            transform: scale(0.99);
        }

        .ghost-button,
        .utility-button {
            padding: 0.95rem 1.35rem;
            font-size: 0.98rem;
            font-weight: 600;
            color: var(--ink);
            background: rgba(255, 255, 255, 0.62);
            border: 1px solid rgba(17, 19, 34, 0.08);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.85),
                0 10px 20px rgba(17, 19, 34, 0.06);
        }

        .utility-button {
            background: rgba(255, 255, 255, 0.42);
        }

        .cta-button:focus-visible,
        .ghost-button:focus-visible,
        .utility-button:focus-visible,
        .manual-input:focus-visible {
            outline: 3px solid rgba(125, 108, 255, 0.72);
            outline-offset: 4px;
            box-shadow:
                0 0 0 5px rgba(255, 255, 255, 0.78),
                0 12px 28px rgba(125, 108, 255, 0.16);
        }

        .manual-panel {
            position: relative;
            display: grid;
            gap: 0.75rem;
            padding: 1rem;
            border-radius: 24px;
            background: var(--panel-bg);
            border: 1px solid rgba(17, 19, 34, 0.06);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.78);
            animation: panelBloom 0.34s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .manual-panel[hidden] {
            display: none;
        }

        .manual-input {
            flex: 1 1 220px;
            width: 100%;
            min-height: 52px;
            padding: 0.9rem 1rem;
            border-radius: 18px;
            border: 1px solid rgba(17, 19, 34, 0.08);
            background: rgba(255, 255, 255, 0.78);
            color: var(--ink);
            box-shadow: inset 0 1px 4px rgba(17, 19, 34, 0.04);
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease;
        }

        .manual-input::placeholder {
            color: rgba(17, 19, 34, 0.44);
        }

        .manual-input:focus {
            transform: translateY(-1px);
            border-color: rgba(255, 143, 182, 0.3);
            background: rgba(255, 255, 255, 0.92);
            box-shadow:
                inset 0 1px 4px rgba(17, 19, 34, 0.03),
                0 12px 28px rgba(255, 143, 182, 0.12);
        }

        .manual-hint {
            font-size: 0.95rem;
            line-height: 1.45;
            color: var(--ink-muted);
        }

        .loading-card,
        .error-card {
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .loading-orb {
            width: clamp(130px, 32vw, 210px);
            aspect-ratio: 1 / 1;
            position: relative;
            border-radius: 42% 58% 53% 47%;
            background:
                radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0.18)),
                linear-gradient(135deg, rgba(255, 186, 186, 0.44), rgba(200, 229, 207, 0.42));
            box-shadow: inset 0 0 82px rgba(255, 255, 255, 0.54), 0 25px 52px rgba(17, 19, 34, 0.22);
            animation: orbPulse 2.4s ease-in-out infinite;
            overflow: hidden;
        }

        .loading-orb::before,
        .loading-orb::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            inset: 15%;
            border: 3px dashed rgba(255, 255, 255, 0.62);
            animation: spin 6s linear infinite;
        }

        .loading-orb::after {
            inset: 30%;
            border-style: solid;
            border-color: rgba(255, 255, 255, 0.42) transparent;
            animation-duration: 4s;
        }

        .loading-text,
        .error-title {
            font-size: clamp(1.35rem, 3vw, 1.95rem);
            font-weight: 700;
            line-height: 1.1;
        }

        .loading-sub,
        .error-copy {
            max-width: 30ch;
            line-height: 1.55;
            color: var(--ink-soft);
        }

        .answer-card {
            gap: 1.4rem;
        }

        .answer-wrap {
            gap: 0.95rem;
            align-content: start;
        }

        .location {
            font-size: 1rem;
            font-weight: 600;
            color: var(--ink-soft);
        }

        .answer {
            display: inline-flex;
            align-items: center;
            gap: 0.85rem;
            font-family: 'Space Grotesk', 'Sora', sans-serif;
            font-size: clamp(3.1rem, 10vw, 6rem);
            font-weight: 700;
            line-height: 0.95;
            letter-spacing: 0;
            opacity: 0;
            transform: translateY(18px) scale(0.96);
            animation: answerPop 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        .answer-icon-wrap {
            display: inline-grid;
            place-items: center;
            flex: 0 0 auto;
            width: clamp(62px, 12vw, 82px);
            height: clamp(62px, 12vw, 82px);
            border-radius: 24px;
            border: 1px solid rgba(17, 19, 34, 0.08);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.84), rgba(255, 255, 255, 0.52));
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.92),
                0 16px 28px var(--answer-glow);
        }

        .answer-icon {
            font-size: clamp(1.9rem, 4vw, 2.6rem);
            line-height: 1;
            transform: translateY(0.05em);
        }

        .answer-word {
            color: var(--answer-accent);
            text-shadow: 0 10px 24px var(--answer-glow);
        }

        .result-copy {
            max-width: 27ch;
            font-size: 1.06rem;
            line-height: 1.5;
            color: var(--ink-soft);
        }

        .result-charm {
            max-width: 27ch;
            margin: 0;
            font-size: 0.9rem;
            line-height: 1.45;
            color: var(--ink-muted);
        }

        .answer-note {
            font-size: 0.98rem;
            line-height: 1.45;
            color: var(--ink-muted);
        }

        .sky-stamp {
            width: fit-content;
            max-width: 100%;
            min-height: 34px;
            display: inline-flex;
            align-items: center;
            padding: 0.38rem 0.7rem;
            border-radius: 999px;
            border: 1px dashed rgba(17, 19, 34, 0.14);
            background: rgba(255, 255, 255, 0.48);
            color: var(--ink-muted);
            font-family: 'IBM Plex Mono', 'Space Grotesk', monospace;
            font-size: 0.72rem;
            line-height: 1.2;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            transform: rotate(-1.2deg);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
        }

        .sky-stamp--right {
            transform: rotate(1.1deg);
        }

        .sky-stamp--flat {
            transform: rotate(-0.15deg);
        }

        .sky-stamp--float {
            animation: stampFloat 5.8s ease-in-out infinite;
        }

        /* ===== Rain forecast — gradient mood-bar + likelihood curve + panels ===== */
        .rain-ribbon-wrap {
            display: grid;
            gap: 0.55rem;
        }

        .ribbon-chart {
            position: relative;
            height: 60px;
            opacity: 0;
            transform: scaleX(0.96);
            transform-origin: left center;
            animation: ribbonRise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
        }

        .rain-ribbon {
            position: absolute;
            inset: 0;
            border-radius: 18px;
            box-shadow: inset 0 1px 3px rgba(17, 19, 34, 0.14), 0 1px 0 rgba(255, 255, 255, 0.7);
        }

        .rain-ribbon--empty {
            background: rgba(206, 209, 224, 0.5);
        }

        .rain-curve {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 18px;
            overflow: hidden;
        }

        .curve-area {
            fill: rgba(255, 255, 255, 0.28);
        }

        .curve-line {
            fill: none;
            stroke: rgba(255, 255, 255, 0.92);
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
            vector-effect: non-scaling-stroke;
            filter: drop-shadow(0 1px 1px rgba(17, 19, 34, 0.22));
        }

        .curve-dot {
            fill: #fff;
            stroke: rgba(17, 19, 34, 0.22);
            stroke-width: 0.5;
            vector-effect: non-scaling-stroke;
        }

        .ribbon-scale {
            display: flex;
            justify-content: space-between;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.66rem;
            letter-spacing: 0.1em;
            text-transform: lowercase;
            color: var(--ink-muted);
        }

        .hour-panels {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
        }

        .hour-panel {
            display: grid;
            justify-items: center;
            gap: 0.2rem;
            padding: 0.6rem 0.4rem;
            border-radius: 16px;
            border: 1px solid rgba(17, 19, 34, 0.07);
            background: rgba(255, 255, 255, 0.5);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
            opacity: 0;
            transform: translateY(10px);
            animation: panelRise 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .hour-panel:nth-child(1) { animation-delay: 0.18s; }
        .hour-panel:nth-child(2) { animation-delay: 0.26s; }
        .hour-panel:nth-child(3) { animation-delay: 0.34s; }
        .hour-panel:nth-child(4) { animation-delay: 0.42s; }

        .hour-time {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.66rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--ink-muted);
        }

        .hour-icon {
            font-size: 1.5rem;
            line-height: 1;
        }

        .hour-odds {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--ink-soft);
        }

        .day-bits {
            margin: 0;
            text-align: center;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.74rem;
            letter-spacing: 0.04em;
            color: var(--ink-muted);
        }

        @keyframes ribbonRise {
            to {
                opacity: 1;
                transform: scaleX(1);
            }
        }

        @keyframes panelRise {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body.yes .answer-card {
            box-shadow: 0 30px 70px rgba(86, 94, 196, 0.16);
        }

        body.maybe .answer-card {
            box-shadow: 0 30px 70px rgba(79, 123, 214, 0.14);
        }

        body.no .answer-card {
            box-shadow: 0 30px 70px rgba(221, 138, 73, 0.16);
        }

        .error-actions {
            justify-content: center;
        }

        .brand-terminal {
            position: fixed;
            left: 1.4rem;
            bottom: 1.3rem;
            z-index: 2;
            display: inline-flex;
            align-items: center;
            min-height: 44px;
            font-size: 0.92rem;
            text-transform: lowercase;
            letter-spacing: 0.06em;
            color: #0b0b0f;
            text-decoration: none;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .sparkle-layer {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 20;
        }

        .sparkle-layer span {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            opacity: 0;
            animation: sparkle 1.1s ease-out forwards;
            box-shadow: 0 0 12px currentColor;
        }

        .tap-burst,
        .sky-toast {
            position: fixed;
            pointer-events: none;
            z-index: 40;
        }

        .tap-burst {
            left: 0;
            top: 0;
            width: 1px;
            height: 1px;
        }

        .tap-burst span {
            position: absolute;
            left: -4px;
            top: -4px;
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: currentColor;
            box-shadow: 0 0 14px currentColor;
            animation: tapBurst 650ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .sky-toast {
            left: 50%;
            bottom: max(1.4rem, env(safe-area-inset-bottom));
            max-width: min(320px, calc(100vw - 2rem));
            padding: 0.75rem 0.95rem;
            border-radius: 999px;
            border: 1px solid rgba(17, 19, 34, 0.08);
            background: rgba(255, 255, 255, 0.78);
            box-shadow: 0 18px 32px rgba(17, 19, 34, 0.12);
            backdrop-filter: blur(18px);
            color: var(--ink);
            font-family: 'IBM Plex Mono', 'Space Grotesk', monospace;
            font-size: 0.78rem;
            line-height: 1.3;
            text-align: center;
            transform: translateX(-50%) translateY(12px) scale(0.98);
            animation: skyToast 2.3s ease forwards;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @keyframes orbPulse {
            0%, 100% { transform: scale(0.92); }
            50% { transform: scale(1.08); }
        }

        @keyframes microBreathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.01); }
        }

        @keyframes sunBob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @keyframes cloudLope {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(5px); }
        }

        @keyframes rainDrift {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(4px); }
        }

        @keyframes microTwinkle {
            0%, 100% {
                opacity: 0.32;
                transform: rotate(45deg) scale(0.88);
            }
            50% {
                opacity: 1;
                transform: rotate(45deg) scale(1.08);
            }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes answerPop {
            50% { opacity: 1; transform: translateY(-6px) scale(1.03); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes wordWobble {
            0% {
                opacity: 0.88;
                transform: translateY(5px) rotate(-0.7deg) scale(0.992);
            }
            45% {
                opacity: 1;
                transform: translateY(-2px) rotate(0.55deg) scale(1.006);
            }
            100% {
                opacity: 1;
                transform: translateY(0) rotate(0deg) scale(1);
            }
        }

        @keyframes wordLilt {
            0% {
                opacity: 0.9;
                transform: translateY(4px) rotate(0.65deg);
            }
            52% {
                opacity: 1;
                transform: translateY(-2px) rotate(-0.35deg);
            }
            100% {
                opacity: 1;
                transform: translateY(0) rotate(0deg);
            }
        }

        @keyframes wordRise {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes stampFloat {
            0%, 100% { transform: rotate(-1.2deg) translateY(0); }
            50% { transform: rotate(0.7deg) translateY(-3px); }
        }

        @keyframes sparkle {
            0% { transform: scale(0.5) translateY(0); opacity: 0.9; }
            60% { transform: scale(1.1) translateY(-30px); opacity: 1; }
            100% { transform: scale(0.4) translateY(-60px); opacity: 0; }
        }

        @keyframes skyWink {
            0%, 100% {
                filter: saturate(1) brightness(1);
                transform: perspective(900px) rotateX(var(--sky-tilt-y)) rotateY(var(--sky-tilt-x)) rotate(var(--scene-tilt)) translate3d(var(--sky-drift-x), var(--sky-drift-y), 0) scale(1);
            }
            42% {
                filter: saturate(1.16) brightness(1.04);
                transform: perspective(900px) rotateX(var(--sky-tilt-y)) rotateY(var(--sky-tilt-x)) rotate(var(--scene-tilt)) translate3d(var(--sky-drift-x), var(--sky-drift-y), 0) scale(1.025);
            }
        }

        @keyframes tapBurst {
            0% {
                transform: translate3d(0, 0, 0) scale(0.6);
                opacity: 0.9;
            }
            100% {
                transform: translate3d(var(--burst-x), var(--burst-y), 0) scale(0.12);
                opacity: 0;
            }
        }

        @keyframes skyToast {
            0% {
                transform: translateX(-50%) translateY(12px) scale(0.98);
                opacity: 0;
            }
            16%, 78% {
                transform: translateX(-50%) translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateX(-50%) translateY(8px) scale(0.98);
                opacity: 0;
            }
        }

        @keyframes auroraShift {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 0%; }
        }

        @keyframes gradientShift {
            0% { transform: rotate(0deg); background-position: 0% 50%; }
            50% { transform: rotate(180deg); background-position: 100% 50%; }
            100% { transform: rotate(360deg); background-position: 0% 50%; }
        }

        @keyframes ambientFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }

        @keyframes panelBloom {
            0% {
                opacity: 0;
                transform: translateY(-8px) scale(0.985);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 768px) {
            body {
                justify-content: center;
                padding:
                    max(1rem, env(safe-area-inset-top))
                    max(1rem, env(safe-area-inset-right))
                    max(1.5rem, env(safe-area-inset-bottom))
                    max(1rem, env(safe-area-inset-left));
            }

            .card {
                border-radius: 28px;
            }

            .hero-layout,
            .result-header {
                grid-template-columns: 1fr;
            }

            .hero-layout .weather-scene-wrap,
            .result-header .weather-scene-wrap {
                order: -1;
            }

            .weather-scene {
                width: 100%;
                min-height: 162px;
            }

            .hero-tag {
                font-size: 0.74rem;
                letter-spacing: 0.22em;
                line-height: 1.35;
            }

            .hero-title {
                font-size: clamp(2.7rem, 13vw, 3.6rem);
            }

            .answer {
                gap: 0.7rem;
            }

            .answer-icon-wrap {
                width: 58px;
                height: 58px;
                border-radius: 20px;
            }

            .hero-actions,
            .manual-form,
            .actions-row,
            .error-actions {
                align-items: stretch;
            }

            .cta-button,
            .ghost-button,
            .utility-button {
                width: 100%;
                justify-content: center;
            }

            .brand-terminal {
                position: static;
                margin-top: 0.9rem;
                font-size: 0.84rem;
                opacity: 0.7;
                justify-content: center;
            }

            .hero-card--manual-open .weather-scene-wrap {
                display: none;
            }
        }

        @media (max-width: 380px), (max-height: 680px) {
            body {
                justify-content: flex-start;
            }

            .card {
                gap: 1rem;
                padding: 1.25rem;
                border-radius: 26px;
            }

            .hero-layout,
            .result-header {
                gap: 0.85rem;
            }

            .hero-stack,
            .answer-wrap {
                gap: 0.65rem;
            }

            .weather-scene {
                min-height: 128px;
                border-radius: 24px;
            }

            .hero-title {
                font-size: clamp(2.35rem, 12vw, 3.05rem);
            }

            .hero-copy {
                font-size: 0.96rem;
                line-height: 1.42;
            }

            .hero-actions,
            .manual-form,
            .actions-row,
            .error-actions {
                gap: 0.65rem;
            }

            .sky-stamp {
                min-height: 30px;
                padding: 0.3rem 0.6rem;
                font-size: 0.68rem;
                letter-spacing: 0.1em;
            }

            .cta-button,
            .ghost-button,
            .utility-button,
            .manual-input {
                min-height: 50px;
            }

            .brand-terminal {
                margin-top: 0.55rem;
            }
        }

        @media (max-width: 340px) {
            .card {
                padding: 1.15rem;
            }

            .weather-scene {
                min-height: 116px;
            }

            .hero-tag {
                font-size: 0.68rem;
            }

            .hero-title {
                font-size: clamp(2.2rem, 12vw, 2.75rem);
            }

            .hero-copy {
                font-size: 0.92rem;
            }
        }

        @media (hover: hover) and (pointer: fine) {
            .card:hover {
                transform: translateY(-6px) scale(1.01);
                box-shadow: 0 34px 74px rgba(15, 19, 43, 0.16);
            }

            .card:hover::after {
                opacity: 1;
            }

            .cta-button:hover {
                animation: none;
                transform: translateY(-2px);

            return String(value ?? '').replace(/[&<>"']/g, (char) => {
                const entities = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                };
                return entities[char] || char;
            });
        }

        async function fetchJson(url, timeout = 9000) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeout);

            try {
                const response = await fetch(url, {
                    signal: controller.signal,
                    headers: {
                        Accept: 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Request failed: ${response.status}`);
                }

                return await response.json();
            } catch (error) {
                const message = error instanceof Error ? error.message : String(error);
                const isNetworkMiss = !navigator.onLine ||
                    error instanceof TypeError ||
                    /failed to fetch|load failed|networkerror/i.test(message);

                if (isNetworkMiss) {
                    throw new Error('NETWORK_UNAVAILABLE');
                }

                throw error;
            } finally {
                clearTimeout(timeoutId);
            }
        }

        function getBrowserLocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error('LOCATION_UNAVAILABLE'));
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        resolve({
                            lat: Number(position.coords.latitude.toFixed(4)),
                            lon: Number(position.coords.longitude.toFixed(4)),
                            source: 'gps'
                        });
                    },
                    reject,
                    {
                        enableHighAccuracy: false,
                        timeout: 6500,
                        maximumAge: 15 * 60 * 1000
                    }
                );
            });
        }

        async function getAutoLocation() {
            try {
                return await getBrowserLocation();
            } catch {
                throw new Error('LOCATION_UNAVAILABLE');
            }
        }

        function buildLocationQuery(location) {
            if (Number.isFinite(Number(location.lat)) && Number.isFinite(Number(location.lon))) {
                return `${location.lat},${location.lon}`;
            }
            return cleanText(location.city);
        }

        function parseForecastDate(dateText) {
            const match = String(dateText || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (!match) {
                return null;
            }

            return {
                year: Number(match[1]),
                monthIndex: Number(match[2]) - 1,
                day: Number(match[3])
            };
        }

        function slotUtcMs(day, slot) {
            const date = parseForecastDate(day.date);
            if (!date) {
                return NaN;
            }

            const hour = Math.floor(numberFrom(slot.time, 0) / 100);
            return Date.UTC(date.year, date.monthIndex, date.day, hour, 0, 0);
        }

        function parseObservationUtcMs(observationTime, fallbackDay) {
            const date = parseForecastDate(fallbackDay?.date);
            const match = String(observationTime || '').trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
            if (!date || !match) {
                return Date.now();
            }

            let hour = Number(match[1]) % 12;
            if (match[3].toUpperCase() === 'PM') {
                hour += 12;
            }

            return Date.UTC(date.year, date.monthIndex, date.day, hour, Number(match[2]), 0);
        }

        function buildTimeline(days) {
            return (days || []).flatMap((day) =>
                (day.hourly || []).map((slot) => {
                    const when = new Date(slotUtcMs(day, slot));
                    return {
                        when,
                        chance: Math.round(numberFrom(slot.chanceofrain, 0)),
                        precipMM: numberFrom(slot.precipMM, 0),
                        weatherCode: numberFrom(slot.weatherCode, null),
                        condition: cleanText(slot.weatherDesc?.[0]?.value || '')
                    };
                })
            ).filter((slot) => Number.isFinite(slot.when.getTime()));
        }

        function pickUpcomingSlots(timeline, referenceTime = Date.now(), limit = 4) {
            const cutoff = referenceTime - (FORECAST_LOOKBACK_MINUTES * 60 * 1000);
            const upcoming = timeline.filter((slot) => slot.when.getTime() >= cutoff).slice(0, limit);
            const base = upcoming.length ? upcoming : timeline.slice(0, limit);

            return base.map((slot) => {
                const diffHours = Math.max(0, Math.round((slot.when.getTime() - referenceTime) / (60 * 60 * 1000)));
                const label = diffHours <= 1 ? 'Now' : `+${Math.ceil(diffHours / 3) * 3}h`;

                return {
                    ...slot,
                    label
                };
            });
        }

        function getSourceNote(source) {
            if (source === 'gps') {
                return 'Found your patch of sky.';
            }
            return 'City set by hand.';
        }

        function isWetCondition(condition) {
            return /\b(rain|drizzle|shower|sleet|snow|thunder|storm)\b/i.test(condition);
        }

        function isRainCode(code) {
            if (code == null) return false;
            return (code >= 51 && code <= 57) ||
                (code >= 61 && code <= 67) ||
                (code >= 80 && code <= 82) ||
                (code >= 95 && code <= 99);
        }

        function weatherCodeToLabel(code) {
            if (code == null) return '';
            if (code === 0) return 'Clear';
            if (code <= 3) return 'Partly cloudy';
            if (code === 45 || code === 48) return 'Fog';
            if (code >= 51 && code <= 55) return 'Drizzle';
            if (code === 56 || code === 57) return 'Freezing drizzle';
            if (code >= 61 && code <= 65) return 'Rain';
            if (code === 66 || code === 67) return 'Freezing rain';
            if (code >= 71 && code <= 77) return 'Snow';
            if (code >= 80 && code <= 82) return 'Rain showers';
            if (code >= 85 && code <= 86) return 'Snow showers';
            if (code >= 95 && code <= 99) return 'Thunderstorm';
            return 'Cloudy';
        }

        function computeRainPrediction(slots, isCurrentlyWet) {
            if (!slots.length) {
                return { precipChance: 0, headline: 'Forecast signal is thin, but it looks dry enough.' };
            }

            let cumulative = 0;
            let maxChance = 0;
            let maxPrecip = 0;
            let hasMeaningfulRain = false;

            for (const slot of slots) {
                const p = slot.chance / 100;
                cumulative = 1 - (1 - cumulative) * (1 - p);
                if (slot.chance > maxChance) maxChance = slot.chance;
                if (slot.precipMM > maxPrecip) maxPrecip = slot.precipMM;

                const code = slot.weatherCode;
                const condition = slot.condition || '';
                const rainSignal = slot.precipMM >= MIN_PRECIP_MM &&
                    (isRainCode(code) || (!code && isWetCondition(condition)));
                if (rainSignal) {
                    hasMeaningfulRain = true;
                }
            }

            let precipChance = Math.round(cumulative * 60 + maxChance * 0.4);

            if (!hasMeaningfulRain && maxPrecip < MIN_PRECIP_MM) {
                precipChance = Math.round(precipChance * 0.8);
            }

            if (isCurrentlyWet) {
                precipChance = Math.max(precipChance, 80);
            }

            precipChance = Math.min(100, Math.max(0, precipChance));

            let headline;
            if (isCurrentlyWet) {
                headline = 'Rain is already in the room.';
            } else if (precipChance >= RAIN_THRESHOLD.YES) {
                headline = hasMeaningfulRain
                    ? 'Rain looks likely. Brolly territory.'
                    : 'Rain odds are running high.';
            } else if (precipChance >= RAIN_THRESHOLD.MAYBE) {
                headline = 'Could swing wet. Pocket umbrella energy.';
            } else {
                headline = 'Nothing rude on the radar.';
            }

            return { precipChance, headline };
        }

        async function geocodeCityOpenMeteo(city) {
            const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en`;
            const data = await fetchJson(url, 6000);
            if (!data?.results?.length) return null;
            const result = data.results[0];
            return {
                lat: result.latitude,
                lon: result.longitude,
                name: result.name || city,
                country: result.country || ''
            };
        }

        async function fetchOpenMeteoForecast(lat, lon) {
            const params = new URLSearchParams({
                latitude: lat,
                longitude: lon,
                hourly: 'precipitation_probability,precipitation,weather_code,temperature_2m',
                current: 'precipitation,weather_code,temperature_2m',
                timezone: 'auto',
                forecast_hours: FORECAST_HOURS
            });
            return await fetchJson(`https://api.open-meteo.com/v1/forecast?${params}`, 8000);
        }

        async function fetchOpenMeteoWeather(location) {
            let lat, lon, cityLabel, countryLabel;

            if (Number.isFinite(Number(location.lat)) && Number.isFinite(Number(location.lon))) {
                lat = location.lat;
                lon = location.lon;
                cityLabel = 'Your area';
                countryLabel = '';
            } else if (location.city) {
                const geo = await geocodeCityOpenMeteo(location.city);
                if (!geo) return null;
                lat = geo.lat;
                lon = geo.lon;
                cityLabel = geo.name;
                countryLabel = geo.country;
            } else {
                return null;
            }

            const data = await fetchOpenMeteoForecast(lat, lon);
            if (!data?.hourly) return null;

            const hourly = data.hourly;
            const current = data.current || {};

            const slots = [];
            for (let i = 0; i < hourly.time.length; i++) {
                slots.push({
                    when: new Date(hourly.time[i]),
                    chance: Math.round(numberFrom(hourly.precipitation_probability?.[i], 0)),
                    precipMM: numberFrom(hourly.precipitation?.[i], 0),
                    weatherCode: numberFrom(hourly.weather_code?.[i], null),
                    condition: weatherCodeToLabel(numberFrom(hourly.weather_code?.[i], null))
                });
            }

            const currentPrecip = numberFrom(current.precipitation, 0);
            const currentCode = numberFrom(current.weather_code, null);
            const isCurrentlyWet = currentPrecip > 0 || isRainCode(currentCode);
            const condition = weatherCodeToLabel(currentCode) || 'Unknown';
            const tempValue = numberFrom(current.temperature_2m, null);

            const prediction = computeRainPrediction(slots, isCurrentlyWet);

            const now = Date.now();
            const labeled = slots.map((slot, i) => ({
                ...slot,
                label: i === 0 ? 'Now' : `+${i}h`
            }));

            const locationLabel = [cityLabel, countryLabel].filter(Boolean).join(', ');

            const nowUtc = new Date();
            const hour12 = nowUtc.getUTCHours() % 12 || 12;
            const minStr = String(nowUtc.getUTCMinutes()).padStart(2, '0');
            const ampm = nowUtc.getUTCHours() >= 12 ? 'PM' : 'AM';

            return {
                precipChance: prediction.precipChance,
                isCurrentlyWet,
                condition,
                tempC: typeof tempValue === 'number' ? `${Math.round(tempValue)}°C` : '--',
                location: {
                    city: cityLabel || 'Your area',
                    country: countryLabel || '',
                    label: locationLabel || 'Unknown',
                    source: location.source || 'manual'
                },
                upcoming: labeled,
                windowHours: FORECAST_HOURS,
                headline: prediction.headline,
                observedAt: `${hour12}:${minStr} ${ampm}`,
                sourceNote: getSourceNote(location.source || 'manual')
            };
        }

        async function fetchWttrWeather(location) {
            const query = buildLocationQuery(location);
            if (!query) {
                throw new Error('No location query available');
            }

            const data = await fetchJson(`https://wttr.in/${encodeURIComponent(query)}?format=j1`);
            const current = data.current_condition?.[0];
            const nearestArea = data.nearest_area?.[0];
            const weatherDays = (data.weather || []).slice(0, 2);
            const timeline = buildTimeline(weatherDays);

            if (!current || !timeline.length) {
                throw new Error('Weather data missing');
            }

            const referenceTime = parseObservationUtcMs(current.observation_time, weatherDays[0]);
            const upcoming = pickUpcomingSlots(timeline, referenceTime);
            const condition = cleanText(current.weatherDesc?.[0]?.value || 'Unknown');
            const isCurrentlyWet = numberFrom(current.precipMM, 0) > 0 || isWetCondition(condition);
            const prediction = computeRainPrediction(upcoming, isCurrentlyWet);
            const windowHours = Math.max(3, upcoming.length * 3);
            const city = cleanText(nearestArea?.areaName?.[0]?.value || location.city || 'Your area');
            const country = cleanText(nearestArea?.country?.[0]?.value || location.country || '');
            const locationLabel = [city, country].filter(Boolean).join(', ');

            return {
                precipChance: prediction.precipChance,
                isCurrentlyWet,
                condition,
                tempC: cleanText(current.temp_C || '--'),
                location: {
                    city,
                    country,
                    label: locationLabel || 'Unknown',
                    source: location.source || 'manual'
                },
                upcoming,
                windowHours,
                headline: prediction.headline,
                observedAt: cleanText(current.observation_time || ''),
                sourceNote: getSourceNote(location.source || 'manual')
            };
        }

        async function getWeather(location) {
            try {
                const result = await fetchOpenMeteoWeather(location);
                if (result) return result;
            } catch {
                // Fall through to wttr.in
            }

            return await fetchWttrWeather(location);
        }

        function determineAnswer(precipChance, isCurrentlyWet) {
            if (isCurrentlyWet || precipChance >= RAIN_THRESHOLD.YES) {
                return 'YES';
            }
            if (precipChance >= RAIN_THRESHOLD.MAYBE) {
                return 'MAYBE';
            }
            return 'NO';
        }

        // ===================================================================
        // Visual rain forecast — gradient mood-bar + a likelihood curve on top,
        // plus four glanceable panels (icon · time · odds).
        // ===================================================================

        // A rain probability (0-100) becomes a colour. Dry = warm sun gold,
        // wet = cool rain blue, with a soft haze through the unsure middle.
        // A gentle gamma keeps low values from flattening into one slab.
        function rainColor(chance) {
            const t = Math.max(0, Math.min(1, chance / 100));
            const eased = Math.pow(t, 0.78);
            if (eased < 0.35) {
                // dry: warm gold -> soft haze
                const k = eased / 0.35;
                return mixColor([255, 209, 122], [205, 210, 228], k);
            }
            // damp -> soaked: haze -> rain blue
            const k = (eased - 0.35) / 0.65;
            return mixColor([205, 210, 228], [96, 144, 224], k);
        }

        function mixColor(a, b, k) {
            const c = a.map((v, i) => Math.round(v + (b[i] - v) * k));
            return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
        }

        // Condition + odds -> a friendly weather glyph for the panels.
        function rainIcon(slot) {
            const c = (slot.condition || '').toLowerCase();
            if (/thunder|storm/.test(c)) return '⛈️';
            if (/snow|sleet/.test(c)) return '🌨️';
            if (/(^|\s)rain|shower/.test(c) || slot.chance >= 65) return '🌧️';
            if (/drizzle/.test(c) || slot.chance >= 40) return '🌦️';
            if (/fog|mist|haze/.test(c)) return '🌫️';
            if (/cloud|overcast/.test(c) || slot.chance >= 20) return '⛅';
            return '☀️';
        }

        // Pick four evenly spaced slots (e.g. Now, +2h, +4h, +5h) from the six.
        function pickPanelSlots(slots) {
            const list = (slots || []).slice(0, 6);
            if (list.length <= 4) return list;
            const idx = [0, 2, 4, list.length - 1];
            return idx.map((i) => list[i]);
        }

        // One short, honest sentence derived from the data — when rain shows
        // up and when it clears — instead of flowery filler.
        function buildRainLine(answer, slots) {
            if (!slots || !slots.length) {
                return answer === 'NO' ? 'Looks clear out there.' : 'Keep an umbrella handy.';
            }

            const wet = slots.map((s) => s.chance >= 45);
            const firstWet = wet.indexOf(true);
            const lastWet = wet.lastIndexOf(true);

            const whenWord = (i) => {
                if (i <= 0) return 'right now';
                if (i === 1) return 'within the hour';
                return `around +${i}h`;
            };

            if (firstWet === -1) {
                return 'Dry all the way through.';
            }
            if (wet[0] && wet[wet.length - 1]) {
                return 'Wet most of the next few hours.';
            }
            if (wet[0]) {
                return `Wet now, easing ${whenWord(lastWet + 1)}.`;
            }
            if (lastWet === wet.length - 1) {
                return `Dry until ${whenWord(firstWet)}, then wet.`;
            }
            return `A wet patch ${whenWord(firstWet)}, dry after.`;
        }

        // Turn points into a smooth SVG path (Catmull-Rom -> cubic Bézier).
        function smoothPath(pts) {
            if (pts.length < 2) {
                return pts.length ? `M${pts[0][0]} ${pts[0][1]}` : '';
            }
            let d = `M${pts[0][0]} ${pts[0][1]}`;
            for (let i = 0; i < pts.length - 1; i++) {
                const p0 = pts[i - 1] || pts[i];
                const p1 = pts[i];
                const p2 = pts[i + 1];
                const p3 = pts[i + 2] || p2;
                const c1x = p1[0] + (p2[0] - p0[0]) / 6;
                const c1y = p1[1] + (p2[1] - p0[1]) / 6;
                const c2x = p2[0] - (p3[0] - p1[0]) / 6;
                const c2y = p2[1] - (p3[1] - p1[1]) / 6;
                d += ` C${c1x.toFixed(2)} ${c1y.toFixed(2)}, ${c2x.toFixed(2)} ${c2y.toFixed(2)}, ${p2[0]} ${p2[1]}`;
            }
            return d;
        }

        // Gradient mood-bar + a rain-likelihood curve drawn over it, then
        // four glanceable panels underneath (icon · time · odds).
        function buildRainRibbon(slots) {
            const list = (slots || []).slice(0, 6);
            if (!list.length) {
                return '<div class="rain-ribbon rain-ribbon--empty" aria-hidden="true"></div>';
            }

            // --- gradient bar (one band per hour) ---
            const stops = list.map((slot, i) => {
                const start = (i / list.length) * 100;
                const end = ((i + 1) / list.length) * 100;
                const color = rainColor(slot.chance);
                return `${color} ${start}%, ${color} ${end}%`;
            }).join(', ');

            // --- likelihood curve (smooth Catmull-Rom spline over the bar) ---
            const W = 100;
            const H = 40;
            const padTop = 5;
            const padBot = 4;
            const pts = list.map((slot, i) => {
                const x = list.length === 1 ? W / 2 : (i / (list.length - 1)) * W;
                const y = padTop + (1 - Math.max(0, Math.min(1, slot.chance / 100))) * (H - padTop - padBot);
                return [Number(x.toFixed(2)), Number(y.toFixed(2))];
            });
            const linePath = smoothPath(pts);
            const areaPath = `${linePath} L${W} ${H} L0 ${H} Z`;
            const dots = pts.map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="1.6" class="curve-dot" />`).join('');

            const curve = `
                <svg class="rain-curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
                    <path class="curve-area" d="${areaPath}" />
                    <path class="curve-line" d="${linePath}" />
                    ${dots}
                </svg>`;

            // --- four glanceable panels ---
            const panelSlots = pickPanelSlots(list);
            const panels = panelSlots.map((slot) => {
                const odds = `${slot.chance}%`;
                return `
                    <div class="hour-panel" role="listitem">
                        <span class="hour-time">${escapeHtml(slot.label)}</span>
                        <span class="hour-icon" aria-hidden="true">${rainIcon(slot)}</span>
                        <span class="hour-odds">${odds}</span>
                    </div>`;
            }).join('');

            return `
                <div class="rain-ribbon-wrap">
                    <div class="ribbon-chart">
                        <div class="rain-ribbon" style="background: linear-gradient(90deg, ${stops});" aria-hidden="true"></div>
                        ${curve}
                    </div>
                    <div class="ribbon-scale" aria-hidden="true"><span>now</span><span>+6h</span></div>
                    <div class="hour-panels" role="list" aria-label="Rain through the next six hours">${panels}</div>
                </div>
            `;
        }

        // Panels are static now; kept as a hook for future interactivity.
        function bindRibbon() {}

        function renderAnswer(answer, weather) {
            setBodyState(answer.toLowerCase());
            content.removeAttribute('aria-busy');

            const label = ANSWER_LABELS[answer];
            const emoji = ANSWER_EMOJI[answer];
            const rainLine = buildRainLine(answer, weather.upcoming);
            const charm = pickAnswerCopy(answer);
            const ribbonMarkup = buildRainRibbon(weather.upcoming);
            const dayBits = [escapeHtml(weather.condition), escapeHtml(weather.tempC)]
                .filter((bit) => bit && bit !== '--')
                .join(' · ');

            content.innerHTML = `
                <section class="card answer-card" aria-labelledby="answerTitle">
                    <div class="result-header">
                        <div class="answer-wrap">
                            <p class="location"><span aria-hidden="true">📍</span> ${escapeHtml(weather.location.label)}</p>
                            <h1 class="answer" id="answerTitle" aria-label="Umbrella verdict: ${escapeHtml(label)}">
                                <span class="answer-icon-wrap" aria-hidden="true"><span class="answer-icon">${emoji}</span></span>
                                <span class="answer-word">${label}</span>
                            </h1>
                            <p class="result-copy">${escapeHtml(rainLine)}</p>
                            <p class="result-charm">${escapeHtml(charm)}</p>
                        </div>
                        <div class="weather-scene-wrap">
                            ${getSkyButtonMarkup(answer.toLowerCase())}
                        </div>
                    </div>
                    ${ribbonMarkup}
                    ${dayBits ? `<p class="day-bits">${dayBits}</p>` : ''}
                    <div class="actions-row">
                        <button class="ghost-button" id="checkAgainButton" type="button">Check again</button>
                        <button class="utility-button" id="manualAgainButton" type="button">Try another city</button>
                    </div>
                </section>
            `;
            announceStatus(
                `Umbrella verdict: ${label}. ${rainLine}`,
            );

            document.getElementById('checkAgainButton').addEventListener('click', (event) => {
                triggerTapBurst(event);
                startCheck(lastLookup);
            });
            document.getElementById('manualAgainButton').addEventListener('click', (event) => {
                triggerTapBurst(event);
                renderIntro({
                    manualOpen: true,
                    city: lastManualCity || weather.location.city
                });
            });

            addWordMotion(content.querySelector('.answer-word'));
            addWordMotion(content.querySelector('.result-copy'));
            bindSkyButton(document.querySelector('.sky-button'));
            bindRibbon(content);
            attachSkyReactivity();
            sounds[answer.toLowerCase()]();
            triggerSparkles(answer.toLowerCase());
        }

        function renderError(message) {
            setBodyState('idle');
            content.removeAttribute('aria-busy');
            content.innerHTML = `
                <section class="card error-card" role="alert" aria-labelledby="errorTitle">
                    <p class="hero-tag">little recalibration</p>
                    <h1 class="error-title" id="errorTitle">That sky check drifted.</h1>
                    <p class="error-copy">${escapeHtml(message)}</p>
                    <div class="error-actions">
                        <button class="ghost-button" id="retryButton" type="button">Try again</button>
                        <button class="utility-button" id="manualButton" type="button">Type a city</button>
                    </div>
                </section>
            `;
            announceStatus(`That sky check drifted. ${message}`);

            document.getElementById('retryButton').addEventListener('click', (event) => {
                triggerTapBurst(event);
                startCheck(lastLookup);
            });
            document.getElementById('manualButton').addEventListener('click', (event) => {
                triggerTapBurst(event);
                renderIntro({
                    manualOpen: true,
                    city: lastManualCity
                });
            });

            sounds.whoops();
            attachSkyReactivity();
        }

        function getLoadingMessage(manualCity) {
            if (manualCity) {
                const line = pickRandom(LOADING_LINES.manual);
                return {
                    headline: line.headline(manualCity),
                    subline: line.subline
                };
            }

            return pickRandom(LOADING_LINES.auto);
        }

        function getErrorMessage(error, manualCity) {
            if (error.message === 'NETWORK_UNAVAILABLE') {
                return "You are offline. The app is here, but the sky line needs internet. Try again when the signal is back.";
            }

            if (error.name === 'AbortError') {
                return 'That check took too long. The sky line might be busy, so give it another shot.';
            }

            if (manualCity) {
                return `Could not place "${manualCity}". Check the spelling and try again.`;
            }

            if (error.message === 'LOCATION_UNAVAILABLE') {
                return 'Location did not land. Allow it, or type a city instead.';
            }

            return 'The weather line drifted. Try again in a sec.';
        }

        async function startCheck(options = {}) {
            if (isChecking) {
                return;
            }

            const manualCity = cleanText(options.manualCity || '');
            lastLookup = manualCity ? { manualCity } : {};
            if (manualCity) {
                lastManualCity = manualCity;
            }

            const loadingCopy = getLoadingMessage(manualCity);
            isChecking = true;
            showLoading(loadingCopy.headline, loadingCopy.subline);
            sounds.listen();

            try {
                const location = manualCity
                    ? { city: manualCity, source: 'manual' }
                    : await getAutoLocation();

                const weather = await getWeather(location);
                if (manualCity) {
                    rememberManualCity(manualCity);
                }

                const answer = determineAnswer(weather.precipChance, weather.isCurrentlyWet);
                renderAnswer(answer, weather);
            } catch (error) {
                renderError(getErrorMessage(error, manualCity));
            } finally {
                isChecking = false;
            }
        }

        function triggerSparkles(answer) {
            if (isReducedMotion()) {
                return;
            }

            const palettes = {
                yes: ['#f472b6', '#d946ef', '#c084fc'],
                maybe: ['#38bdf8', '#5f5ae0', '#a5b4fc'],
                no: ['#fcd34d', '#fb7185', '#fdba74']
            };

            const colors = palettes[answer] || palettes.maybe;
            const layer = document.createElement('div');
            layer.className = 'sparkle-layer';

            for (let index = 0; index < 16; index += 1) {
                const dot = document.createElement('span');
                const size = Math.random() * 8 + 6;
                dot.style.width = `${size}px`;
                dot.style.height = `${size}px`;
                dot.style.left = `${45 + (Math.random() - 0.5) * 40}%`;
                dot.style.top = `${42 + (Math.random() - 0.5) * 34}%`;
                dot.style.color = colors[index % colors.length];
                dot.style.animationDelay = `${Math.random() * 0.2}s`;
                layer.appendChild(dot);
            }

            document.body.appendChild(layer);
            setTimeout(() => layer.remove(), 1300);
        }

        function triggerTapBurst(event) {
            if (isReducedMotion()) {
                return;
            }

            sounds.tap();
            const source = event?.currentTarget || event?.target;
            const rect = source?.getBoundingClientRect?.();
            const originX = rect ? rect.left + rect.width / 2 : window.innerWidth / 2;
            const originY = rect ? rect.top + rect.height / 2 : window.innerHeight / 2;
            const colors = ['#ff82bf', '#f7b172', '#9579ff', '#8ed8ff'];
            const layer = document.createElement('div');
            layer.className = 'tap-burst';
            layer.style.transform = `translate3d(${originX}px, ${originY}px, 0)`;

            for (let index = 0; index < 10; index += 1) {
                const dot = document.createElement('span');
                const angle = (Math.PI * 2 * index) / 10;
                const distance = 24 + Math.random() * 18;
                dot.style.setProperty('--burst-x', `${Math.cos(angle) * distance}px`);
                dot.style.setProperty('--burst-y', `${Math.sin(angle) * distance}px`);
                dot.style.color = colors[index % colors.length];
                dot.style.animationDelay = `${index * 12}ms`;
                layer.appendChild(dot);
            }

            document.body.appendChild(layer);
            setTimeout(() => layer.remove(), 800);
        }

        function showSkyToast(message) {
            document.querySelector('.sky-toast')?.remove();

            const toast = document.createElement('div');
            toast.className = 'sky-toast';
            toast.setAttribute('role', 'status');
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2400);
        }

        function triggerSkyWhimsy() {
            if (!isReducedMotion()) {
                document.body.classList.add('delight');
                triggerSparkles('maybe');
                setTimeout(() => document.body.classList.remove('delight'), 1800);
            }

            showSkyToast(pickRandom(SKY_TOASTS));
        }

        function bindSkyButton(button) {
            if (!button || button.dataset.skyBound === 'true') {
                return;
            }

            button.dataset.skyBound = 'true';
            button.addEventListener('click', () => {
                button.classList.remove('sky-wink');
                void button.offsetWidth;
                button.classList.add('sky-wink');
                triggerSkyWhimsy();
                setTimeout(() => button.classList.remove('sky-wink'), 760);
            });
        }

        function attachSkyReactivity() {
            if (isReducedMotion() || !window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
                return;
            }

            document.querySelectorAll('.card').forEach((card) => {
                if (card.dataset.skyReactive === 'true') {
                    return;
                }

                card.dataset.skyReactive = 'true';
                let animationFrame = 0;

                card.addEventListener('pointermove', (event) => {
                    cancelAnimationFrame(animationFrame);
                    animationFrame = requestAnimationFrame(() => {
                        const rect = card.getBoundingClientRect();
                        const x = ((event.clientX - rect.left) / rect.width) - 0.5;
                        const y = ((event.clientY - rect.top) / rect.height) - 0.5;

                        card.style.setProperty('--sky-drift-x', `${x * 8}px`);
                        card.style.setProperty('--sky-drift-y', `${y * 6}px`);
                        card.style.setProperty('--sky-tilt-x', `${x * 4}deg`);
                        card.style.setProperty('--sky-tilt-y', `${y * -4}deg`);
                    });
                });

                card.addEventListener('pointerleave', () => {
                    cancelAnimationFrame(animationFrame);
                    card.style.setProperty('--sky-drift-x', '0px');
                    card.style.setProperty('--sky-drift-y', '0px');
                    card.style.setProperty('--sky-tilt-x', '0deg');
                    card.style.setProperty('--sky-tilt-y', '0deg');
                });
            });
        }

        function bindBrandEasterEgg() {
            const brand = document.querySelector('.brand-terminal');
            if (!brand) {
                return;
            }

            let pressTimer = 0;
            let didLongPress = false;

            const clearPress = () => {
                clearTimeout(pressTimer);
            };

            brand.addEventListener('pointerdown', () => {
                didLongPress = false;
                clearPress();
                pressTimer = setTimeout(() => {
                    didLongPress = true;
                    triggerSkyWhimsy();
                }, 720);
            });

            brand.addEventListener('pointerup', clearPress);
            brand.addEventListener('pointercancel', clearPress);
            brand.addEventListener('pointerleave', clearPress);
            brand.addEventListener('click', (event) => {
                if (didLongPress) {
                    event.preventDefault();
                    didLongPress = false;
                }
            });
        }

        function shouldOpenManualFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('manual') === '1';
        }

        function registerServiceWorker() {
            if (!('serviceWorker' in navigator) || window.location.protocol === 'file:') {
                return;
            }

            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
            });
        }

        lastManualCity = readSavedManualCity();
        applyVisitMood();

        if (shouldOpenManualFromUrl()) {
            renderIntro({ manualOpen: true });
        } else {
            personalizeIntro(content);
            bindIntroEvents();
        }
        bindBrandEasterEgg();
        registerServiceWorker();
    </script>
</body>
</html>
